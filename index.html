<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عسعوسي | البوت الخاص</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #f1f7f5;
      background:
        radial-gradient(circle at 50% 10%, rgba(0,220,145,.14), transparent 30%),
        linear-gradient(180deg, #06131e, #07101c 60%, #050b14);
    }

    .container {
      width: min(100%, 620px);
      margin: auto;
      padding: 18px 16px 35px;
    }

    /* الشريط العلوي */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #9ca8b5;
      font-size: 25px;
    }

    .dots {
      letter-spacing: 4px;
    }

    .code {
      direction: ltr;
      color: #d5dce3;
    }

    /* الشعار */
    .logo {
      width: 125px;
      height: 125px;
      margin: 25px auto 12px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        145deg,
        #09e19a,
        #04b97c
      );

      box-shadow:
        0 0 45px rgba(0, 225, 150, .20);
    }

    .crown {
      font-size: 62px;
      color: #07151b;
    }

    /* النسخة الخاصة */
    .badge {
      width: max-content;
      margin: 0 auto 25px;
      padding: 8px 18px;
      border-radius: 25px;

      background: rgba(0,220,145,.10);
      border: 1px solid rgba(0,220,145,.28);

      color: #2de3aa;
      font-size: 13px;
      font-weight: bold;
    }

    /* العنوان */
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 29px;
    }

    .hero h1 span {
      color: #18df9e;
    }

    .hero p {
      margin: 0;
      color: #8d99a7;
      font-size: 13px;
    }

    /* البطاقة */
    .card {
      padding: 18px;
      border-radius: 24px;

      background:
        linear-gradient(
          155deg,
          rgba(20,31,52,.97),
          rgba(8,17,32,.98)
        );

      border: 1px solid rgba(255,255,255,.04);
      box-shadow: 0 18px 50px rgba(0,0,0,.3);
    }

    .title {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    /* الإدخال */
    .input-box {
      position: relative;
      margin-bottom: 13px;
    }

    input {
      width: 100%;
      height: 62px;

      border: 1px solid rgba(255,255,255,.05);
      outline: none;
      border-radius: 16px;

      background: #080f20;
      color: white;

      padding: 0 55px 0 15px;
      font-family: inherit;
      font-size: 15px;
    }

    input::placeholder {
      color: #697586;
    }

    .icon {
      position: absolute;
      right: 12px;
      top: 10px;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;
      background: rgba(0,220,145,.12);

      font-size: 21px;
    }

    /* زر الدخول */
    .login {
      width: 100%;
      height: 60px;

      border: none;
      border-radius: 17px;

      background: linear-gradient(
        135deg,
        #05df96,
        #0ac985
      );

      color: #03150f;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 28px rgba(0,220,145,.15);
    }

    .login:active {
      transform: scale(.98);
    }

    /* الأوضاع */
    .modes {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .mode {
      height: 58px;
      border: 1px solid transparent;
      border-radius: 15px;

      background: #080f20;
      color: #adb7c2;

      font-family: inherit;
      font-size: 13px;
    }

    .mode.active {
      color: #2ee5ad;
      border-color: rgba(0,220,145,.30);
    }

    /* الإحصائيات */
    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      padding: 15px 5px;
      text-align: center;

      background: #080f20;
      border-radius: 16px;
    }

    .number {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .green {
      color: #2de3ad;
    }

    .small {
      color: #8793a0;
      font-size: 11px;
    }

    /* معلومات */
    .info {
      margin-top: 15px;
      padding: 17px;

      text-align: center;
      line-height: 1.9;

      color: #8995a2;
      font-size: 12px;

      border-radius: 16px;
      background: rgba(4,13,25,.75);
      border: 1px solid rgba(255,255,255,.03);
    }

    .shield {
      color: #2ee4ac;
      font-size: 21px;
    }

    /* الحالة */
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      margin-top: 10px;
      color: #31e3ac;
      font-size: 11px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #20df9f;
      box-shadow: 0 0 10px #20df9f;
    }

    /* الجوال الصغير */
    @media(max-width:390px) {
      .container {
        padding: 13px 11px 25px;
      }

      .logo {
        width: 110px;
        height: 110px;
      }

      .hero h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- الأعلى -->
  <div class="top">
    <div class="dots">•••</div>
    <div class="code">&lt;/&gt;</div>
  </div>

  <!-- الشعار -->
  <div class="logo">
    <div class="crown">♛</div>
  </div>

  <div class="badge">
    ✦ نسخة خاصة • PRIVATE EDITION
  </div>

  <!-- الترحيب -->
  <div class="hero">
    <h1>
      مرحباً بك<br>
      <span>عسعوسي</span>
    </h1>

    <p>
      البوت الخاص بك • محلل Smarty الخاص
    </p>
  </div>

  <!-- البطاقة الرئيسية -->
  <div class="card">

    <div class="title">
      أدخل الرمز الخاص بك
    </div>

    <div class="input-box">
      <div class="icon">🔑</div>

      <input
        id="token"
        type="text"
        placeholder="أدخل الرمز الخاص"
      >
    </div>

    <button
      class="login"
      onclick="activate()"
    >
      🔒 تفعيل البوت الخاص - دخول
    </button>

    <!-- الأوضاع -->
    <div class="modes">

      <button
        class="mode"
        onclick="mode(this,'EN')"
      >
        ✦<br>
        EN
      </button>

      <button
        class="mode active"
        onclick="mode(this,'الكامل')"
      >
        ✦<br>
        الكامل
      </button>

      <button
        class="mode"
        onclick="mode(this,'الأساسي')"
      >
        ♛<br>
        الأساسي
      </button>

    </div>

    <!-- الإحصائيات -->
    <div class="stats">

      <div class="stat">
        <div class="number">68</div>
        <div class="small">سوق</div>
      </div>

      <div class="stat">
        <div class="number green">Smarty</div>
        <div class="small">محلل خاص</div>
      </div>

      <div class="stat">
        <div class="number">∞</div>
        <div class="small">مدى الحياة</div>
      </div>

    </div>

    <!-- المعلومات -->
    <div class="info">

      <div class="shield">♢</div>

      هذا البوت خاص بالمستخدم
      <br>
      محلل Smarty خاص • فلاتر ذكية
      <br>
      حساسية قابلة للتحكم

      <div class="status">
        <span class="dot"></span>
        <span id="status">
          جاهز للتشغيل
        </span>
      </div>

    </div>

  </div>

</div>

<script>

function activate() {

  const token =
    document.getElementById("token").value.trim();

  if (!token) {
    alert("أدخل الرمز الخاص أولاً");
    return;
  }

  document.getElementById("status").textContent =
    "البوت مفعّل محلياً";

  alert("تم التفعيل بنجاح");

}

function mode(button, name) {

  document
    .querySelectorAll(".mode")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("status").textContent =
    "الوضع: " + name;

}

</script>

</body>
  </html>
