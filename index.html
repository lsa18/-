<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert Signal Bot</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
  text-align:center;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
h1{margin-bottom:5px}
.card{
  background:#151d33;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}
select,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:16px;
}
button{
  background:#1683ff;
  color:white;
  font-weight:bold;
}
.signal{
  font-size:42px;
  font-weight:bold;
  margin:20px 0;
}
.green{color:#20d878}
.red{color:#ff4d5d}
.yellow{color:#ffd34d}
.info{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
  padding:10px;
  background:#202a45;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 Expert Signal Bot</h1>
<p>نظام إشارات تجريبي — مدة 30 دقيقة</p>

<div class="card">

<label>اختر الأصل:</label>

<select id="asset">
<option>EUR/USD</option>
<option>GBP/USD</option>
